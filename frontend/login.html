<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <script>
    (function(){
        var session = JSON.parse(localStorage.getItem("currentSession") || "null");
        if (session) {
            window.location.replace(session.role === "Admin" ? "dashboard.html" : "employee-dashboard.html");
        }
    })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14161F">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SG Sanatan HRMS">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Login | SG Sanatan HRMS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/mobile.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="login-body">

    <div class="login-wrap">

        <div class="login-card">

            <div class="login-logo">

                <img src="assets/logo.webp" alt="Logo">

                <h1>SG Sanatan</h1>
                <p>Employees Management System</p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label>Email</label>

                    <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="username">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-field">

                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">

                        <button type="button" id="togglePassword" tabindex="-1">
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>

                <div id="loginError" class="login-error"></div>

                <button type="button" class="login-btn" id="loginBtn">
                    Login
                </button>

            </form>

            <div class="login-hint">

                <i class="fa-solid fa-circle-info"></i>
                Log in with the email &amp; password set up for your account.
                Employees: your admin sets this up when adding you.

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
