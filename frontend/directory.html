<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <script>
    (function(){
        var session = JSON.parse(localStorage.getItem("currentSession") || "null");
        var allowedRoles = ['Employee'];
        if (!session || allowedRoles.indexOf(session.role) === -1) {
            var target = !session ? "login.html" : (session.role === "Admin" ? "dashboard.html" : "employee-dashboard.html");
            window.location.replace(target);
        }
    })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Directory | SG Sanatan HRMS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/employees.css">
    <link rel="stylesheet" href="css/topbar.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">

                <img src="assets/logo.webp" alt="Logo">

                <h2>SG Sanatan</h2>
                <p>Employees Management System</p>

            </div>

            <ul id="sidebarMenu">

            </ul>

        </aside>

        <main class="content">

            <div id="commonTopbar"></div>

            <!-- Cards -->

            <div class="cards">

                <div class="card">
                    <h3>Colleagues</h3>
                    <h2 id="totalCount">0</h2>
                </div>

                <div class="card">
                    <h3>Departments</h3>
                    <h2 id="deptCount">0</h2>
                </div>

            </div>

            <!-- Filters -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchEmployee"
                    placeholder="Search by name or designation..."
                    autocomplete="off">

            </div>

            <div style="margin-bottom:22px;">

                <select id="departmentFilter" style="height:48px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14.5px;font-family:var(--font-body);background:var(--surface);min-width:220px;">

                    <option value="">All Departments</option>

                </select>

            </div>

            <!-- Table -->

            <div class="table-box">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="directoryTable">

                        <tr><td colspan="5">Loading...</td></tr>

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/directory.js"></script>

</body>

</html>
